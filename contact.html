<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="assets/favicon.png" type="image/x-icon">
        <link rel="stylesheet" href="styles/style.css" type="text/css">
        <link rel="stylesheet" href="styles/contact.css" type="text/css">
        <title>Mossberg's Portfolio | Contact Me</title>
    </head>

    <body>
        <div class="grid-container">
            <header>
                <a href="index.html"><h1>Johan Mossberg</h1></a>
            </header>
            <nav>
                <ul>
                    <li><h2><a href="index.html"> About</a></h2></li>
                    <li><h2><a href="projects.html"> Projects</a></h2></li>
                    <li><h2><a href="skills.html"> Skills</a></h2></li>
                    <li id="current-page"><h2><a href="contact.html"> Contact</a></h2></li>
                </ul>
            </nav>
            <main>
                <section class="contact">
                    <h2>Contact Me</h2>
                    <form class="contact-form" action="#" method="post" aria-label="Contact form" novalidate>
                        <div class="form-first-name">
                            <label for="first-name">First Name <span class="required">*</span></label>
                            <input id="first-name" name="first-name" type="text" placeholder="John" required>
                            <span class="error-message" id="first-name-error"></span>
                        </div>

                        <div class="form-last-name">
                            <label for="last-name">Last Name <span class="required">*</span></label>
                            <input id="last-name" name="last-name" type="text" placeholder="Doe" required>
                            <span class="error-message" id="last-name-error"></span>
                        </div>

                        <div class="form-email">
                            <label for="email">Email Address <span class="required">*</span></label>
                            <input id="email" name="email" type="email" placeholder="john.doe@example.com" required>
                            <span class="error-message" id="email-error"></span>
                        </div>

                        <div class="form-phone">
                            <label for="phone">Phone Number</label>
                            <input id="phone" name="phone" type="tel" placeholder="+1 (555) 123-4567">
                            <span class="error-message" id="phone-error"></span>
                        </div>

                        <div class="form-subject">
                            <label for="subject">Subject <span class="required">*</span></label>
                            <select id="subject" name="subject" required>
                                <option value="" disabled selected>Choose a subject</option>
                                <option value="question">Question</option>
                                <option value="feedback">Feedback</option>
                                <option value="collaboration">Collaboration</option>
                                <option value="other">Other</option>
                            </select>
                            <span class="error-message" id="subject-error"></span>
                        </div>

                        <div class="form-message-field">
                            <label for="message">Message <span class="required">*</span></label>
                            <textarea id="message" name="message" rows="8" placeholder="Your message..." required minlength="20"></textarea>
                            <div id="message-counter">0/20 characters</div>
                            <span class="error-message" id="message-error"></span>
                        </div>

                        <div class="form-send">
                            <button type="submit" id="form-send">Send Message</button>
                        </div>

                        <div class="form-clear"> 
                            <button type="reset" id="form-clear">Clear</button>
                        </div>
                    </form>
                </section>
            </main>
            <footer>
                <p>©2025 Johan Mossberg</p>
                <div class="footericons">
                    <a href="https://mail.google.com" aria-label="Gmail"><img src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico" alt="Gmail link"></a>
                    <a href="https://facebook.com/" aria-label="Facebook"><img src="https://static.xx.fbcdn.net/rsrc.php/yx/r/e9sqr8WnkCf.ico" alt="Facebook link"></a>
                    <a href="https://linkedin.com/" aria-label="LinkedIn"><img src="https://static.licdn.com/aero-v1/sc/h/al2o9zrvru7aqj8e1x2rzsrca" alt="Linkedin link"></a>
                </div>
            </footer>
        </div>
        <script src="scripts/contact.js"></script>
    </body>
</html>
